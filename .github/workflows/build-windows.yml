name: Build DFIN DSKEYS v5.7.3 HQ Logo Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pillow send2trash websocket-client cryptography

      - name: Generate Windows icon from high-quality logo
        shell: powershell
        run: |
          if (-not (Test-Path "dfin_logo.png")) {
            throw "dfin_logo.png is missing from the repository root"
          }
          python -c "from PIL import Image; im=Image.open('dfin_logo.png').convert('RGBA'); im.save('dfin_logo.ico', format='ICO', sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])"
          if (-not (Test-Path "dfin_logo.ico")) {
            throw "dfin_logo.ico could not be generated"
          }
          Get-Item dfin_logo.png
          Get-Item dfin_logo.ico

      - name: Build application folder
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --icon "dfin_logo.ico" `
            --version-file "version_info.txt" `
            --add-data "dfin_logo.png;." `
            --name "DFIN_DSKEYS_Manager" `
            --hidden-import "send2trash" `
            --hidden-import "websocket" `
            DFIN_DSKEYS_Manager.py

      - name: Verify application build
        shell: powershell
        run: |
          $exe = "dist\DFIN_DSKEYS_Manager\DFIN_DSKEYS_Manager.exe"
          if (-not (Test-Path $exe)) {
            throw "DFIN application EXE was not generated"
          }
          Get-Item $exe

      - name: Download Python installer and offline packages
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force vendor
          Invoke-WebRequest "https://www.python.org/ftp/python/3.13.7/python-3.13.7-amd64.exe" -OutFile "vendor\python-3.13.7-amd64.exe"
          python -m pip download --only-binary=:all: --dest vendor send2trash cryptography websocket-client

      - name: Verify installer resources
        shell: powershell
        run: |
          if (-not (Test-Path "vendor\python-3.13.7-amd64.exe")) {
            throw "Python installer was not downloaded"
          }
          if (-not (Test-Path "DFIN_DSKEYS_Manager.iss")) {
            throw "DFIN_DSKEYS_Manager.iss is missing"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" DFIN_DSKEYS_Manager.iss'

      - name: Locate generated installer
        shell: powershell
        run: |
          $file = Get-ChildItem -Path installer -Filter "*.exe" -File | Select-Object -First 1
          if (-not $file) {
            throw "No installer EXE was generated"
          }
          Copy-Item $file.FullName "DFIN_DSKEYS_Manager_Setup_v5.7.3_HQ_LOGO.exe"
          Get-Item "DFIN_DSKEYS_Manager_Setup_v5.7.3_HQ_LOGO.exe"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DFIN-DSKEYS-Manager-Setup-v5.7.3-HQ-LOGO
          path: DFIN_DSKEYS_Manager_Setup_v5.7.3_HQ_LOGO.exe
          if-no-files-found: error
          compression-level: 0
